name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aucun droit d'écriture : ce workflow lit le code et rapporte, il ne modifie
# jamais le dépôt. Un jeton en lecture seule ne peut pas être détourné pour
# pousser un commit, même si une dépendance de la chaîne était compromise.
permissions:
  contents: read

jobs:
  qualite:
    name: Qualité et tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 est le plancher déclaré dans pyproject.toml. Le tester vraiment
        # évite d'y écrire par mégarde de la syntaxe plus récente : la version
        # de développement locale seule ne le dirait jamais.
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation
        run: pip install -e ".[dev]"

      # Le style passe en premier : il échoue en quelques secondes, là où la
      # suite de tests prend plus longtemps. Sur un échec de style, inutile
      # d'attendre le reste.
      - name: Style (ruff)
        run: ruff check src tests

      - name: Format (ruff)
        run: ruff format --check src tests

      - name: Types (mypy)
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing

  securite:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Installer puis désinstaller « butin » peut surprendre, mais c'est le
      # seul moyen d'auditer nos dépendances sans nous auditer nous-mêmes.
      #
      # pip-audit interroge PyPI pour chaque distribution présente dans
      # l'environnement. « butin » n'y est pas publié, donc le job échouait sur
      # notre propre code au lieu d'une vraie vulnérabilité. --skip-editable ne
      # règle rien : avec --strict, un paquet ignoré compte comme un échec, les
      # deux options se contredisent.
      #
      # Même chose pour « bdo-ocr-core » depuis qu'il est une dépendance : lui
      # aussi vit sur GitHub, pas sur PyPI (voir bdo-ocr-core/README.md pour
      # pourquoi), donc pip-audit ne peut pas non plus l'auditer lui-même.
      # Sa propre CI l'audite déjà côté bdo-ocr-core ; ce job-ci audite les
      # dépendances QUE bdo-ocr-core amène (numpy), pas bdo-ocr-core lui-même.
      #
      # L'installation reste le moyen de résoudre les dépendances déclarées
      # dans pyproject.toml : elles restent en place après la désinstallation
      # de nos deux seuls paquets non publiés, et la liste ne peut pas se
      # désynchroniser comme le ferait un requirements.txt tenu à la main.
      - name: Installation des dépendances
        run: |
          pip install -e ".[dev]"
          pip uninstall --yes butin bdo-ocr-core

      # Job séparé de la matrice : une alerte de vulnérabilité ne dépend pas de
      # la version de Python, la répéter trois fois n'apprendrait rien et
      # triplerait le bruit sur un même avis.
      - name: Audit (pip-audit)
        run: pip-audit --strict --desc
