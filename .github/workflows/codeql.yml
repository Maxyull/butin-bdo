name: CodeQL

# Analyse statique de sécurité, gratuite sur dépôt public.
# Résultats dans l'onglet Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Hebdomadaire : rattrape les nouvelles règles CodeQL sur du code qui n'a
    # pas bougé. Une règle publiée après le dernier commit ne serait jamais
    # appliquée sans ce passage périodique.
    - cron: '27 4 * * 2'

jobs:
  analyze:
    name: Analyse (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialisation
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          # security-extended plutôt que security-and-quality : le pack
          # « quality » est du linting déjà couvert par ruff, et il enterre les
          # vraies alertes de sécurité sous du bruit qui finit par ne plus être
          # trié du tout.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:python'
