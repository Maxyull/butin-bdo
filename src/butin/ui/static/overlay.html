<meta charset="utf-8">
<title>Butin — en direct</title>
<link rel="icon" href="/butin.png" type="image/png">
<style>
  /* ⚠️ Fond entièrement transparent. C'est la seule raison d'être de cette
     page : elle se pose PAR-DESSUS le jeu, et tout pixel opaque qu'elle
     ajoute est un pixel de jeu que le joueur ne voit plus. Seules les
     pastilles de texte ont un fond, et il est translucide. */
  /* ⛔ Meme garde que dans `index.html`, et pour la meme raison : la regle
     `[hidden] { display: none }` vient de la feuille du NAVIGATEUR, et toute
     regle d'auteur qui pose un `display` la bat en silence. Deux elements de la
     fenetre principale sont restes affiches ainsi pendant des semaines, dont un
     bouton VIDE. Aucun element de cette page-ci n'est concerne aujourd'hui : la
     regle est posee pour celui qu'on ajoutera demain. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e6e8ee; user-select: none; overflow: hidden;
  }
  /* Le halo sombre remplace un fond opaque : il rend le texte lisible sur un
     décor clair sans cacher le jeu derrière. */
  body { text-shadow: 0 1px 3px #000, 0 0 6px #000; }

  #cadre {
    padding: 10px 12px;
    background: rgba(12, 14, 19, 0.55);
    border: 1px solid rgba(120, 130, 150, 0.35);
    border-radius: 10px;
    backdrop-filter: blur(2px);
  }

  /* La poignée de déplacement est explicite : sans cadre de fenêtre, rien
     n'indiquerait qu'on peut bouger le panneau, et le joueur croirait qu'il
     est cloué là où il est tombé. */
  #barre {
    display: flex; align-items: center; gap: 10px;
    margin: -10px -12px 8px; padding: 6px 12px;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 10px 10px 0 0;
    cursor: move; font-size: 12px; color: #97a0b5;
  }
  #barre .titre { letter-spacing: .08em; text-transform: uppercase; }
  #barre button {
    background: transparent; color: #97a0b5;
    border: 1px solid rgba(120, 130, 150, 0.35); border-radius: 6px;
    padding: 2px 9px; cursor: pointer; font-size: 12px;
  }
  /* Sur le PREMIER bouton seulement. Mise sur la règle générale, la marge
     automatique s'appliquerait à tous et se partagerait l'espace libre au
     lieu de les pousser ensemble à droite. */
  #recalibrer { margin-left: auto; }
  /* La même poussée à droite que le premier bouton : sans elle, la ligne qui
     les remplace se collerait au titre et la barre changerait d'allure selon
     un réglage qui n'a rien à voir avec la mise en page. */
  #sans-clic { margin-left: auto; font-style: italic; }
  #barre button:hover { color: #ff8b3d; border-color: #ff8b3d; }

  /* ⚠️ La pause doit se voir de loin, et pas seulement dans le libellé d'un
     bouton. C'est le seul écran regardé en farmant : un total qui n'augmente
     plus est indistinguable d'un farm calme, et là c'est NOUS qui l'aurions
     arrêté. Le cadre change donc de couleur, franchement. */
  #cadre.en-pause { border-color: rgba(242, 193, 78, 0.75); }
  #pause.reprendre { color: #f2c14e; border-color: rgba(242, 193, 78, 0.75); }
  #en-pause {
    display: none; color: #f2c14e; font-size: 13px; padding: 4px 0;
    letter-spacing: .06em;
  }
  #cadre.en-pause #en-pause { display: block; }

  .chiffres { display: flex; gap: 20px; margin-bottom: 8px; }
  .chiffres div { min-width: 92px; }
  .chiffres .etiquette { font-size: 10px; color: #97a0b5; letter-spacing: .06em; }
  .chiffres .valeur { font-size: 19px; font-variant-numeric: tabular-nums; }

  /* ⛔ Plus de hauteur fixe. Elle valait 260 px avec `overflow: hidden`, donc
     les objets au-dela etaient simplement INVISIBLES — pas coupes a moitie,
     pas signales : absents. Signale par Maxime le 07/08/2026, sa derniere
     ligne etait tronquee alors qu'il avait neuf objets distincts.

     La liste pousse maintenant les bords de la fenetre (voir
     `ajusterLaHauteur`), et ne defile QUE lorsque la fenetre a atteint sa
     borne haute : defiler dans un panneau pose sur le jeu est le dernier
     recours, pas le comportement normal. */
  #drops { max-height: calc(100vh - 200px); overflow-y: auto; }

  /* ⚠️ La barre de defilement de cette liste restait au theme CLAIR du
     systeme : une bande blanche pleine hauteur, posee sur le jeu, dans un
     panneau dont toute la raison d'etre est de ne rien cacher.

     Elle est donc plus discrete qu'ailleurs, et sa piste est TRANSPARENTE :
     une piste peinte serait un rectangle opaque de plus par-dessus le decor,
     visible en permanence meme quand la liste tient entierement.

     ⛔ Pas de `scrollbar-color` ici non plus : le poser fait IGNORER les regles
     `::-webkit-scrollbar` par Chromium, donc la piste redeviendrait opaque.
     Mesure et detail dans `index.html`. */
  :root { color-scheme: dark; }

  #drops::-webkit-scrollbar { width: 8px; }
  #drops::-webkit-scrollbar-track { background: transparent; }
  #drops::-webkit-scrollbar-thumb {
    background: rgba(120, 130, 150, .45); border-radius: 999px;
    border: 2px solid transparent; background-clip: content-box;
  }
  #drops::-webkit-scrollbar-thumb:hover {
    background: rgba(160, 172, 195, .65); background-clip: content-box;
  }
  .drop { display: flex; gap: 9px; align-items: center; padding: 2px 0; font-size: 14px; }
  .drop .qte { color: #97a0b5; font-variant-numeric: tabular-nums; }
  .drop .valeur { margin-left: auto; font-variant-numeric: tabular-nums; color: #cfd4e0; }
  /* L'image garde sa place même quand elle manque : sans taille fixe, une
     icône qui arrive après coup décalerait toute la ligne sous les yeux du
     joueur, et le récap sauterait à chaque téléchargement. */
  .drop .icone {
    width: 26px; height: 26px; flex: 0 0 26px; object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
  }
  .drop .icone.absente { visibility: hidden; }
  @keyframes arrivee { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
  .drop.neuf { animation: arrivee .35s ease-out; }

  /* Les couleurs de rareté du jeu, identiques à la fenêtre principale. */
  .rarete-0 { color: #e6e8ee; }
  .rarete-1 { color: #6fdb6f; }
  .rarete-2 { color: #57a8ff; }
  .rarete-3 { color: #f2c14e; }
  .rarete-4 { color: #ff8b3d; }
  .rarete-5 { color: #ff8b3d; }

  #vide { color: #97a0b5; font-size: 13px; padding: 4px 0; }
  #panne { color: #ff8b3d; font-size: 13px; padding: 4px 0; display: none; }

  /* ⛔ « Je ne vois plus le chat ». Plus voyant que la panne, parce que c'est
     la seule chose qui ne se voit PAS autrement : un compteur qui n'augmente
     plus ressemble a un farm calme. Le 07/08/2026, quatre minutes de menu
     Echap ont coute 560 objets sur 4 080, sans un mot a l'ecran. */
  #masque {
    display: none; color: #ffd7c2; background: rgba(224, 113, 95, .22);
    border: 1px solid rgba(224, 113, 95, .65); border-radius: 6px;
    font-size: 13px; padding: 6px 9px; margin: 4px 0; line-height: 1.35;
  }
  #cadre.masque #masque { display: block; }
</style>

<div id="cadre">
  <div id="barre">
    <span class="titre">Butin — en direct</span>
    <span id="etat"></span>
    <button id="recalibrer" title="Recalibre la zone si le chat a bougé, sans perdre le butin déjà compté">Recalibrer</button>
    <button id="pause" title="Suspend la capture et arrête de compter le temps">Pause</button>
    <button id="fermer" title="Arrête la session et referme le panneau">Arrêter</button>
    <!-- ⛔ Quand la souris traverse le panneau, aucun de ces boutons ne peut
         plus recevoir de clic. Ils disparaissent alors au profit de cette
         ligne : un bouton qui ne répond pas se lit comme un logiciel cassé,
         alors que c'est un réglage, et qu'il se décoche. -->
    <span id="sans-clic" hidden>la souris passe à travers — pilote depuis la fenêtre Butin</span>
  </div>

  <div class="chiffres">
    <div><div class="etiquette">SILVER/HEURE</div><div class="valeur" id="par-heure">0</div></div>
    <div><div class="etiquette">TOTAL NET</div><div class="valeur" id="total">0</div></div>
    <div><div class="etiquette">DURÉE</div><div class="valeur" id="duree">00:00:00</div></div>
  </div>

  <div id="en-pause">EN PAUSE — le temps ne compte plus, rien n'est enregistré.</div>
  <div id="masque"></div>
  <div id="panne"></div>
  <div id="drops"><div id="vide">En attente du premier drop…</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const nombre = (v) => new Intl.NumberFormat("fr-FR").format(Math.round(v || 0));

function chrono(secondes) {
  const s = Math.max(0, Math.floor(secondes));
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  return h + ":" + m + ":" + String(s % 60).padStart(2, "0");
}

// Quantité déjà affichée par objet, pour repérer celles qui viennent de monter.
// Une Map et non un Set : c'est la VARIATION qui signale un drop, pas la
// présence de la ligne, qui elle ne disparaît plus de la session.
let dejaVus = new Map();

function afficher(etat) {
  const stats = etat.stats;
  $("par-heure").textContent = nombre(stats ? stats.par_heure : 0);
  $("total").textContent = nombre(stats ? stats.total : 0);
  $("duree").textContent = chrono(etat.session ? etat.session.duree_s : 0);

  // La pause est un arrêt VOLONTAIRE, donc elle s'annonce autrement qu'une
  // panne. Mais elle s'annonce, et pour la même raison : sans ça, une pause
  // oubliée est du farm perdu que rien à l'écran ne signale.
  const enPause = Boolean(etat.session && etat.session.en_pause);
  $("cadre").classList.toggle("en-pause", enPause);
  $("pause").textContent = enPause ? "Reprendre" : "Pause";
  $("pause").classList.toggle("reprendre", enPause);

  // ⛔ Souris traversante : le panneau ne reçoit plus AUCUN clic, donc ses trois
  // boutons ne peuvent plus rien faire. On les retire au lieu de les laisser
  // faire semblant. Voir `butin/souris.py` pour ce que le réglage change.
  const traversante = Boolean(etat.reglages && etat.reglages.souris_traversante);
  for (const bouton of ["recalibrer", "pause", "fermer"]) $(bouton).hidden = traversante;
  $("sans-clic").hidden = !traversante;

  const capture = etat.capture;
  // Une panne du fil de capture doit se voir ICI aussi : c'est le seul écran
  // que le joueur regarde pendant qu'il farme, et un total qui n'augmente plus
  // sans explication est indistinguable d'un farm calme.
  $("panne").style.display = capture && capture.erreur ? "block" : "none";
  if (capture && capture.erreur) $("panne").textContent = "Capture arrêtée : " + capture.erreur;
  $("etat").textContent = capture ? capture.drops_enregistres + " drops" : "";

  // ⛔ La zone calibree ne rend plus une seule ligne. C'est la panne qui ne se
  // voit PAS : le fil tourne, le total reste, et tout ressemble a un farm
  // calme. Le 07/08/2026, quatre minutes de menu Echap ont coute 560 objets
  // sur 4 080 sans un mot a l'ecran.
  const masque = !!(capture && capture.chat_masque);
  $("cadre").classList.toggle("masque", masque);
  if (masque) {
    // La duree est dite : « depuis 4 min » se lit autrement que « depuis 31 s ».
    const s = Math.round(capture.secondes_sans_texte || 0);
    const duree = s >= 60 ? Math.floor(s / 60) + " min " + (s % 60) + " s" : s + " s";
    $("masque").textContent =
      "⚠️ Le chat n'est plus visible depuis " + duree +
      " — rien n'est compté. Un menu le recouvre, ou la fenêtre a bougé.";
  }

  // ⭐ Le RÉCAP CUMULÉ, et non le fil des drops un par un. Sur des heures de
  // farm, « combien j'ai ramassé de Pierres noires » est la question ; « quel
  // objet est tombé il y a quatre secondes » ne l'est plus au bout de dix
  // minutes. Le fil défilait plus vite qu'on ne le lit.
  const butin = etat.butin || [];
  const zone = $("drops");
  if (!butin.length) {
    dejaVus = new Map();
    zone.innerHTML = '<div id="vide">En attente du premier drop…</div>';
    return;
  }

  const vues = new Map();
  zone.innerHTML = "";
  for (const ligne of butin.slice(0, 12)) {
    vues.set(ligne.item_id, ligne.quantite);
    // Une ligne s'anime quand sa quantité AUGMENTE. C'est ce qui remplace
    // l'arrivée d'une ligne neuve : sans ça, un récap cumulé ne dirait plus
    // jamais « quelque chose vient de tomber ».
    const avant = dejaVus.get(ligne.item_id);
    const bouge = dejaVus.size && (avant === undefined || avant < ligne.quantite);

    const rangee = document.createElement("div");
    rangee.className = "drop" + (bouge ? " neuf" : "");

    const icone = document.createElement("img");
    icone.className = "icone";
    icone.alt = "";
    icone.src = "/icone/" + ligne.item_id;
    // Une image absente ne doit rien casser ni rien décaler : elle se cache,
    // la ligne garde sa place, et le drop reste lisible.
    icone.addEventListener("error", () => icone.classList.add("absente"));

    const nom = document.createElement("span");
    nom.className = "rarete-" + (ligne.rarete || 0);
    // textContent : un nom d'objet vient d'une source externe.
    nom.textContent = ligne.nom;
    const qte = document.createElement("span");
    qte.className = "qte";
    qte.textContent = "x" + nombre(ligne.quantite);
    const valeur = document.createElement("span");
    valeur.className = "valeur";
    valeur.textContent = ligne.valeur_totale ? nombre(ligne.valeur_totale) : "—";

    rangee.append(icone, nom, qte, valeur);
    zone.appendChild(rangee);
  }
  dejaVus = vues;
}

$("pause").addEventListener("click", async () => {
  const bouton = $("pause");
  // Désactivé le temps de l'aller-retour : la capture met jusqu'à cinq
  // secondes à s'arrêter proprement, et un second clic pendant ce temps
  // demanderait une reprise sur une pause pas encore prise.
  bouton.disabled = true;
  try {
    const enPause = bouton.textContent === "Reprendre";
    const reponse = await fetch(enPause ? "/api/session/reprendre" : "/api/session/pause", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: "{}",
    });
    const corps = await reponse.json();
    if (!reponse.ok) {
      // Une reprise refusée laisse la session EN PAUSE. Le dire ici, sinon le
      // joueur repart farmer en croyant que ça recompte.
      $("panne").style.display = "block";
      $("panne").textContent = "Reprise impossible : " + (corps.erreur || "raison inconnue");
      return;
    }
    afficher(corps);
  } finally {
    bouton.disabled = false;
  }
});

$("recalibrer").addEventListener("click", async () => {
  const bouton = $("recalibrer");
  // Comme Pause : désactivé le temps de l'aller-retour. Le recalibrage
  // suspend puis relance la capture, quelques secondes pendant lesquelles un
  // second clic n'aurait pas de sens.
  bouton.disabled = true;
  const texteInitial = bouton.textContent;
  bouton.textContent = "Recalibrage…";
  try {
    const reponse = await fetch("/api/session/recalibrer", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: "{}",
    });
    const corps = await reponse.json();
    if (!reponse.ok) {
      // Même canal que l'échec de reprise : un message qui reste visible
      // jusqu'au prochain rafraîchissement d'une seconde.
      $("panne").style.display = "block";
      $("panne").textContent = "Recalibrage impossible : " + (corps.erreur || "raison inconnue");
      return;
    }
    afficher(await (await fetch("/api/etat")).json());
  } finally {
    bouton.disabled = false;
    bouton.textContent = texteInitial;
  }
});

$("fermer").addEventListener("click", async () => {
  await fetch("/api/session/arreter", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: "{}",
  });
  // La fenêtre se referme d'elle-même : l'application surveille la fin de
  // session. Rien à faire de plus ici.
});

// ---------------------------------------------- Le panneau suit son contenu
//
// Demande par Maxime : « on prend de plus en plus d'items en grindant », et la
// derniere ligne etait coupee. La fenetre fait 380 px de haut au depart et ne
// bougeait jamais.
//
// ⛔ On ne redemande une taille QUE si elle a change d'assez pour se voir. La
// hauteur du contenu bouge d'un pixel a chaque rafraichissement (nombres qui
// changent de largeur, animations) : redimensionner la fenetre du systeme une
// fois par seconde la ferait vibrer sous les yeux du joueur.
let hauteurDemandee = 0;
const PAS_DE_REDIMENSION = 24;

async function ajusterLaHauteur() {
  const cadre = $("cadre");
  const liste = $("drops");
  if (!cadre || !liste) return;

  // ⛔ On calcule la hauteur VOULUE a partir du nombre de lignes, sans la lire
  // sur la liste elle-meme. `#drops` est plafonne par `max-height` pour pouvoir
  // defiler quand la fenetre ne peut plus grandir : mesurer sa hauteur reelle
  // rendrait donc toujours le plafond, et le panneau ne grandirait jamais
  // au-dela. Le raisonnement se mordrait la queue.
  const lignes = liste.children.length;
  const uneLigne = liste.firstElementChild ? liste.firstElementChild.offsetHeight : 0;
  const hauteurListe = lignes * (uneLigne || 22);
  const chrome = cadre.offsetHeight - liste.offsetHeight;
  const voulue = chrome + hauteurListe + 16;
  if (Math.abs(voulue - hauteurDemandee) < PAS_DE_REDIMENSION) return;
  hauteurDemandee = voulue;
  try {
    await fetch("/api/panneau/taille", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({hauteur: voulue}),
    });
  } catch (erreur) {
    // Un confort. S'il echoue, le panneau garde sa taille et tout le reste
    // continue : la capture ne depend pas de la hauteur d'une fenetre.
  }
}

async function rafraichir() {
  try {
    afficher(await (await fetch("/api/etat")).json());
    await ajusterLaHauteur();
  } catch (erreur) {
    // Le serveur local s'arrête quand l'application se ferme. Ce n'est pas une
    // panne à signaler au joueur, c'est la fin normale.
  }
}

rafraichir();
setInterval(rafraichir, 1000);
</script>
