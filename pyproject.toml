[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "butin"
# Voir docs/versionnage.md pour ce que 0.y.z promet (et ne promet pas) et
# CHANGELOG.md pour le détail de chaque version.
version = "0.14.0"
description = "Suivi de butin pour Black Desert Online, pensé pour le client français"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxime Lacoste" }]
keywords = ["black-desert-online", "bdo", "loot-tracker", "ocr", "francais"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: French",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]

dependencies = [
  "mss>=9.0.1",
  "Pillow>=10.0.0",
  "numpy>=1.26",
  "requests>=2.31.0",
  # Normalisation FR et détection de défilement/stabilité, extraites d'ici et
  # partagées avec rubin-bdo. Voir bdo-ocr-core/README.md.
  #
  # Épinglé sur le SHA du commit, PAS sur l'étiquette `v0.1.0` qui le désigne.
  # Une étiquette git reste déplaçable (`git tag -f` puis `push -f`) : elle dit
  # quelle version on VOULAIT, jamais quel code on obtient. Ce dépôt épingle
  # déjà ses actions GitHub par SHA pour cette raison exacte, et n'a pas de
  # raison de s'appliquer une règle plus faible à lui-même.
  # La version reste en commentaire, sinon le SHA est illisible.
  # Vérifié par tests/test_dependances.py.
  "bdo-ocr-core @ git+https://github.com/Maxyull/bdo-ocr-core.git@6b465fd2c856ce276c5b8763dde173614a7e2aee",  # v0.2.0
  "rapidfuzz>=3.6",
  # Moteur OCR. Choisi contre Tesseract parce qu'il s'installe entièrement par
  # pip : aucun binaire système à télécharger séparément, aucune variable PATH à
  # régler à la main. Voir docs/ocr.md pour le raisonnement complet.
  "rapidocr-onnxruntime>=1.3.24",
  "platformdirs>=4.0",
  # Fenêtre de l'application. Enveloppe la vue système (WebView2 sur Windows)
  # autour de l'interface locale déjà écrite : un vrai logiciel qui s'ouvre,
  # sans réécrire en widgets natifs ce qui marche et qui est testé.
  #
  # Le paquet de base s'installe partout ; seules les liaisons graphiques sont
  # propres à la plateforme, et elles ne sont chargées qu'à l'ouverture de la
  # fenêtre. L'intégration continue peut donc l'installer sans affichage.
  "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
  "pip-audit>=2.7",
]
# Séparé de `dev` volontairement : personne d'autre que la personne qui
# construit une distribution n'en a besoin, et l'intégration continue ne le
# fait pas. L'y mettre gonflerait chaque installation de développement et
# chaque `pip-audit` d'un outil que ni les tests ni la CI n'utilisent jamais.
installeur = ["pyinstaller>=6.0"]

[project.urls]
Source = "https://github.com/Maxyull/butin-bdo"
Bogues = "https://github.com/Maxyull/butin-bdo/issues"

[project.scripts]
butin = "butin.__main__:main"

[project.gui-scripts]
# Lanceur SANS console. Sur Windows, un point d'entrée « scripts » ouvre une
# fenêtre de terminal noire à côté de l'application : c'est la différence entre
# un logiciel et un script qu'on a lancé. Les deux points d'entrée coexistent,
# celui-ci pour l'usage, l'autre pour le diagnostic.
butin-app = "butin.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
butin = ["py.typed", "ui/static/*.html", "ui/static/*.css", "ui/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "reseau: test nécessitant un accès réseau réel (désactivé par défaut en CI)",
]
filterwarnings = [
  "error",
  # Les tests de l'interface lancent un VRAI serveur HTTP plutôt que de le
  # simuler, ce qui est le bon choix : c'est la seule façon de vérifier
  # l'adresse d'écoute et l'absence d'en-tête CORS. Le contrecoup est qu'arrêter
  # ce serveur laisse le ramasse-miettes signaler une socket fermée, depuis un
  # fil de travail et à un moment imprévisible. C'est un artefact du démontage,
  # pas un défaut du code testé.
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/butin"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: pas de couverture", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # tri des imports
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # ombrage des noms natifs
  "C4",        # comprehensions
  "SIM",       # simplifications
  "PTH",       # préférer pathlib
  "RUF",       # règles ruff
  "S",         # bandit : contrôles de sécurité
]
ignore = [
  # Les chaînes du domaine (noms d'objets, messages) sont en français et
  # contiennent des caractères que RUF001/RUF002/RUF003 signalent comme
  # « ambigus » par rapport à leur équivalent ASCII. C'est un faux positif
  # systématique sur ce projet, qui est francophone par conception.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# S101 : les assertions sont le mécanisme normal de pytest.
# S105/S106 : les valeurs codées en dur dans les tests sont des données de test,
#   pas des secrets.
# S311 : `random` sert à SIMULER du bruit d'OCR reproductible dans les tests de
#   suivi, jamais à produire quoi que ce soit de sensible. Un générateur
#   cryptographique y serait au contraire nuisible, puisque la reproductibilité
#   à graine fixe est ce qui rend ces tests utilisables.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
# Pas de python_version figée, volontairement.
#
# La fixer à 3.10 alors que l'intégration continue lance mypy sur trois
# interpréteurs crée une contradiction : sur le job 3.12, numpy installe des
# stubs écrits en syntaxe 3.12 (« type X = ... », PEP 695) que mypy refuse de
# lire quand on lui demande de viser 3.10, et l'analyse s'arrête sur une erreur
# de syntaxe dans une dépendance plutôt que sur notre code.
#
# Sans la clé, mypy vise la version de l'interpréteur qui l'exécute. Chaque job
# de la matrice vérifie donc le code avec la sémantique de SA version, ce qui
# couvre mieux le plancher 3.10 que ne le faisait la valeur figée.
files = ["src"]
strict = true
warn_unreachable = true
# Ces paquets n'expédient pas d'annotations de types.
[[tool.mypy.overrides]]
module = ["mss.*", "rapidocr_onnxruntime.*", "cv2.*"]
ignore_missing_imports = true
